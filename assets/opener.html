<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open link</title>
<style>
  :root {
    --surface: #1b181e; --fg: #f3f2f4; --muted: #a8a4ad; --border: #3a3640;
    --primary: #d8ff3e; --primaryFg: #1b1520; --input: #2c2933;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--fg); background: var(--surface);
  }
  .wrap { padding: 20px 22px 22px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; letter-spacing: .04em; text-transform: uppercase; }
  .label { font-size: 20px; color: var(--fg); font-weight: 650; margin: 0 0 4px; word-break: break-all; line-height: 1.25; }
  .url { font-size: 12px; color: var(--muted); word-break: break-all; margin: 0 0 18px; user-select: all; }
  a.open, button {
    display: block; width: 100%; padding: 13px; border-radius: 12px; font-size: 14px;
    cursor: pointer; text-decoration: none; text-align: center; border: 1px solid var(--border);
    background: var(--input); color: var(--fg); margin-top: 10px; font-family: inherit; font-weight: 500;
  }
  a.open { background: var(--primary); color: var(--primaryFg); border-color: var(--primary); font-weight: 700; }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row button { margin-top: 0; }
  .status { font-size: 12px; color: var(--muted); min-height: 15px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Open link</h1>
    <div class="label" id="label">link</div>
    <div class="url" id="url"></div>
    <a class="open" id="open" href="#" target="_blank" rel="noopener noreferrer">Open in new tab &#8599;</a>
    <div class="row">
      <button type="button" id="copy">Copy URL</button>
      <button type="button" id="close">Close</button>
    </div>
    <div class="status" id="status"></div>
  </div>

<script>
(function () {
  var api = null;
  try { api = acquireDrawdyApi(); } catch (e) {}
  var current = "";

  function $(id) { return document.getElementById(id); }
  function done() { if (api) api.postMessage({ kind: "opened" }); }

  function applyStyling(s) {
    if (!s) return; var r = document.documentElement.style;
    var map = { surface: "--surface", foreground: "--fg", mutedForeground: "--muted", border: "--border", primary: "--primary", primaryForeground: "--primaryFg", surface2: "--input" };
    Object.keys(map).forEach(function (k) { if (s[k]) r.setProperty(map[k], s[k]); });
  }

  function tryOpen() {
    try { return window.open(current, "_blank", "noopener,noreferrer"); }
    catch (e) { return null; }
  }

  function isSafe(u) { return /^\s*(https?|mailto):/i.test(u); }

  function show(msg) {
    current = String(msg.url || "");
    applyStyling(msg.styling);
    $("label").textContent = msg.label || current;
    $("url").textContent = current;
    $("status").textContent = "";

    // Defense in depth: never put a non-http(s)/mailto URL in an href or
    // window.open — javascript:/data:/file: there are XSS / local-file vectors.
    if (!isSafe(current)) {
      $("open").removeAttribute("href");
      $("open").style.opacity = "0.5";
      $("open").style.pointerEvents = "none";
      $("status").textContent = "Blocked: unsafe link scheme.";
      return;
    }
    $("open").href = current;

    var w = tryOpen();
    if (w) {
      // Success: for a shift+click, vanish silently; otherwise confirm briefly.
      $("status").textContent = "Opened in a new tab.";
      setTimeout(done, msg.direct ? 0 : 350);
      return;
    }
    // Blocked (the usual case for a programmatic popup): show the card so the
    // in-frame button click can open it. Same UI for direct and normal.
    $("status").textContent = "Popup blocked — click “Open in new tab”.";
  }

  $("open").addEventListener("click", function () { setTimeout(done, 200); });
  $("copy").onclick = function () {
    var ok = false;
    try { if (navigator.clipboard) { navigator.clipboard.writeText(current); ok = true; } } catch (e) {}
    if (!ok) {
      var r = document.createRange(); r.selectNodeContents($("url"));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      try { document.execCommand("copy"); ok = true; } catch (e) {}
    }
    $("status").textContent = ok ? "Copied." : "Select the URL above to copy.";
  };
  $("close").onclick = function () { if (api) api.postMessage({ kind: "close" }); };

  if (api) {
    api.onMessage(function (msg) { if (msg && msg.kind === "open") show(msg); });
    api.postMessage({ kind: "ready" });
  }
})();
</script>
</body>
</html>
